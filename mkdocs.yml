site_name: "Fire VASE"
site_description: "Developmental wildfire morphology, evidence, data, and reproducible methods"
site_url: "https://cu-esiil.github.io/fire_vase/"

repo_name: "CU-ESIIL/fire_vase"
repo_url: "https://github.com/CU-ESIIL/fire_vase"
edit_uri: "edit/main/docs/"

nav:
  - Overview: index.md
  - Approach:
      - What Fire VASE does: approach.md
      - Observations and data boundary: data.md
      - Building a VASE: methods.md
  - Findings:
      - Evidence overview: findings/index.md
      - Developmental pathways: findings/developmental-pathways.md
      - Temporal ordering: findings/temporal-ordering.md
      - Weather and recent state: findings/weather-and-state.md
      - Mismatched fires: findings/mismatched-fires.md
  - Validation:
      - How we tried to break Fire VASE: validation/index.md
      - Geometry: validation/geometry.md
      - 3-D hull decisions: validation/hull3d.md
      - Data attribution: validation/climate.md
      - Software QA:
          - Pipe and stream: validation/pipeline.md
          - Cube and HTML integrity: validation/cube.md
          - External sources: validation/external.md
          - Expected-failure controls: validation/contrast.md
  - Reproduce:
      - Reproduce Fire VASE: reproduce/index.md
      - Quick start: vignette-reproduce-pipeline.md
      - Data and data lake: reproduce-data-lake.md
      - Notebooks: reproduce/notebooks.md
      - Analysis and code: code-map.md
      - Figures: reproduce-figures.md
  - Paper:
      - Scientific narrative: manuscript.md
      - Technical manuscript: manuscripts/fire_vase_developmental_morphology/manuscript_v2.md
      - Manuscript PDF: manuscripts/fire_vase_developmental_morphology/main-22.pdf
      - Supplement PDF: manuscripts/fire_vase_developmental_morphology/supplementary-4.pdf
  - Project Record:
      - Corrections and reanalysis: reanalysis-v2.md
      - AI Transparency: manuscripts/fire_vase_developmental_morphology/ai_transparency_statement.md
      - Expanded AI Transparency Report: manuscripts/fire_vase_developmental_morphology/ai_transparency_report.md
      - Citation Audit: manuscripts/fire_vase_developmental_morphology/final_citation_check_2026-07-23.md
      - Migration note: migration.md
      - Historical technical records:
          - Historical Science Style Revision: manuscripts/fire_vase_developmental_morphology/manuscript_climate_revision_science_style.md
          - Historical Climate Revision: manuscripts/fire_vase_developmental_morphology/manuscript_climate_revision.md
  - Technical Reference:
      - FIRED Dataset: datasets/fired.md
      - Lakehouse Architecture: dev/fire_vase_lakehouse.md
      - Examples: examples.md

theme:
  name: material
  logo: assets/esiil_content/esiil_oasis_logo.png
  favicon: assets/esiil_content/favicon.ico
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
