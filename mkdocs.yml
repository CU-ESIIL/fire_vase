site_name: "Fire VASE"
site_description: "Developmental wildfire morphology, evidence, data, and reproducible methods"
site_url: "https://cu-esiil.github.io/fire_vase/"

repo_name: "CU-ESIIL/fire_vase"
repo_url: "https://github.com/CU-ESIIL/fire_vase"
edit_uri: "edit/main/docs/"

nav:
  - Home: index.md
  - Manuscript Narrative: manuscript.md
  - Corrected Evidence: reanalysis-v2.md
  - Full Reproduction Vignette: vignette-reproduce-pipeline.md
  - Validation:
      - Overview: validation/index.md
      - Pipe And Stream: validation/pipeline.md
      - Cube And HTML Integrity: validation/cube.md
      - Geometry And Hull: validation/geometry.md
      - 3-D Hull Decisions: validation/hull3d.md
      - Climate Attribution: validation/climate.md
      - External Sources: validation/external.md
      - Expected-Failure Contrast: validation/contrast.md
  - Reproduce Data Lake: reproduce-data-lake.md
  - Reproduce Figures: reproduce-figures.md
  - Methods Notes: methods.md
  - Code Map: code-map.md
  - Manuscript:
      - Corrected V2 Technical Manuscript: manuscripts/fire_vase_developmental_morphology/manuscript_v2.md
      - Historical Science Style Revision: manuscripts/fire_vase_developmental_morphology/manuscript_climate_revision_science_style.md
      - AI Transparency: manuscripts/fire_vase_developmental_morphology/ai_transparency_statement.md
      - Expanded AI Transparency Report: manuscripts/fire_vase_developmental_morphology/ai_transparency_report.md
      - Historical Climate Revision: manuscripts/fire_vase_developmental_morphology/manuscript_climate_revision.md
      - Citation Audit: manuscripts/fire_vase_developmental_morphology/final_citation_check_2026-07-23.md
  - Reference:
      - Data Boundary: data.md
      - FIRED Dataset: datasets/fired.md
      - Lakehouse Architecture: dev/fire_vase_lakehouse.md
      - Examples: examples.md
      - Migration Note: migration.md

theme:
  name: material
  logo: assets/esiil_content/esiil_oasis_logo.png
  favicon: assets/esiil_content/favicon.ico
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
